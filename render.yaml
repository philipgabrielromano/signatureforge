# SignatureForge — Render Blueprint
# Deploy: Render Dashboard → New → Blueprint → connect this repo
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: signatureforge-db
    databaseName: signatureforge
    user: signatureforge
    # Current flexible compute plan (256 MB). The legacy Postgres
    # "starter" instance type is not available for new databases.
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: 16
    diskSizeGB: 1

services:
  - type: web
    name: signatureforge
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    preDeployCommand: node node_modules/prisma/build/index.js migrate deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signatureforge-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: signatureforge-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_DEMO_MODE
        value: "false"
      - key: AZURE_AD_CLIENT_ID
        sync: false
      - key: AZURE_AD_CLIENT_SECRET
        sync: false
      - key: AZURE_AD_TENANT_ID
        sync: false
      - key: MS365_CLIENT_ID
        sync: false
      - key: MS365_CLIENT_SECRET
        sync: false
      - key: MS365_TENANT_ID
        sync: false
      - key: AZURE_STORAGE_ACCOUNT_NAME
        sync: false
      - key: AZURE_STORAGE_ACCOUNT_KEY
        sync: false
      - key: AZURE_STORAGE_CONTAINER_NAME
        sync: false
      - key: AZURE_STORAGE_PUBLIC_URL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false

  - type: cron
    name: signatureforge-cron
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile.cron
    dockerContext: .
    schedule: "*/5 * * * *"
    envVars:
      - key: APP_URL
        fromService:
          name: signatureforge
          type: web
          property: host
      - key: CRON_SECRET
        fromService:
          name: signatureforge
          type: web
          envVarKey: CRON_SECRET
